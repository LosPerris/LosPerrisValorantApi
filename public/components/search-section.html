<section class="card search-card" id="search-section">
    <form id="rank-form">
        <div class="form-group">
            <label for="region">Region</label>
            <select id="region" required>
                <option value="na">NA</option>
                <option value="eu">EU</option>
                <option value="ap">AP</option>
                <option value="kr">KR</option>
                <option value="latam">LATAM</option>
                <option value="br">BR</option>
            </select>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="name">Riot ID</label>
                <input type="text" id="name" placeholder="PonssLoveless" required>
            </div>
            <div class="form-group">
                <label for="tag">Tag</label>
                <input type="text" id="tag" placeholder="8882" required>
            </div>
        </div>
        <button type="submit" id="submit-btn" class="btn-primary">BUSCAR</button>
    </form>
    <div id="recent-searches" class="recent-searches hidden"></div>
    <p class="error-msg hidden" id="error-msg"></p>
</section>
