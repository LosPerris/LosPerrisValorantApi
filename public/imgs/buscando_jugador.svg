<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">

  <style>
    .text-style {
      font-family: 'Outfit', 'Arial Black', sans-serif;
      font-weight: 800;
      text-anchor: middle;
      text-transform: uppercase;
    }
  </style>

  <text x="50%" y="115" class="text-style" font-size="45" fill="#ece8e1" letter-spacing="2">
    BUSCANDO JUGADOR
    <animate attributeName="opacity" values="0;1;1;0;0;0;0" keyTimes="0;0.05;0.3;0.35;0.95;1;1" dur="6s" repeatCount="indefinite" />
  </text>

  <text x="50%" y="115" class="text-style" font-size="55" fill="#ff4655" letter-spacing="4">
    LOSPERRIS
    <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.3;0.35;0.4;0.65;0.7;1" dur="6s" repeatCount="indefinite" />
  </text>

  <g id="loader">
    <circle cx="300" cy="100" r="40" fill="none" stroke="#ff4655" stroke-width="8" stroke-dasharray="180" stroke-dashoffset="100" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 300 100" to="360 300 100" dur="0.8s" repeatCount="indefinite" />
    </circle>
    <animate attributeName="opacity" values="0;0;0;0;0;1;1" keyTimes="0;0.3;0.35;0.65;0.7;0.75;1" dur="6s" repeatCount="indefinite" />
  </g>
</svg>