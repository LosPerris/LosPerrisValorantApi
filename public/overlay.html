<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LosPerris Valorant Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/overlay.css">
</head>

<body>
    <div class="overlay-wrapper" style="position: relative;">
        <div id="overlay-container" class="overlay-container hidden">
            <div id="glow-container" class="glow-container"></div>
            <div class="overlay-bg"></div>
            <div class="left-accent"></div>

            <div class="rank-section">
                <div class="rank-glow"></div>
                <img id="rank-icon" class="rank-icon" src="" alt="Rank Icon">
            </div>

            <div class="player-info">
                <div class="identity">
                    <span id="player-name" class="name"></span><span id="player-tag" class="tag"></span>
                </div>
                <div class="stats">
                    <span id="rank-name" class="rank-name"></span>
                    <span class="divider">/</span>
                    <span id="rr-text" class="rr-value"></span>
                </div>
                <div id="progress-container" class="progress-container">
                    <div id="rr-progress-bar" class="rr-progress-bar"></div>
                </div>
            </div>

            <div class="mmr-section">
                <div class="mmr-bg"></div>
                <span id="mmr-change" class="mmr-change"></span>
                <span id="kda-text" class="kda-text hidden"></span>
            </div>
        </div>

        <div id="twitch-channel" class="twitch-channel hidden">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 2H3v16h5v4l4-4h5l4-4V2zm-10 9V7m5 4V7"></path>
            </svg>
            <span id="twitch-name"></span>
        </div>
    </div>

    <div id="status-message" class="status-message">
        <div class="spinner"></div>
        <span>Initializing Tracker...</span>
    </div>

    <script src="/js/overlay.js"></script>
</body>

</html>
